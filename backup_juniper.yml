---
- name: Backup Junos configuration
  hosts: juniper_switches
  gather_facts: no
  connection: ansible.netcommon.netconf

  vars:
    backup_dir: "/home/iass/awx-deploy/backup"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    file_path: "{{ backup_dir }}/{{ inventory_hostname | replace(' ', '_') }}_{{ timestamp }}.txt"

  tasks:
    - name: Pastikan folder backup ada
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Ambil konfigurasi aktif dari switch
      junipernetworks.junos.junos_command:
        commands: show configuration
      register: config_output

    - name: Buat dan verifikasi file dalam satu tugas
      ansible.builtin.shell: |
        echo "{{ config_output.stdout[0] }}" > "{{ file_path }}"
        echo "--- FILE CONTENT ---"
        cat "{{ file_path }}"
        echo "--- END FILE CONTENT ---"
        ls -l "{{ file_path }}"
      args:
        executable: /bin/bash
      delegate_to: localhost
