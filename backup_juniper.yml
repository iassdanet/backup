---
- name: Backup konfigurasi Juniper via NETCONF
  hosts: junos
  connection: ansible.netcommon.netconf
  gather_facts: no

  vars:
    backup_root: "./backup"
    backup_date: "{{ ansible_date_time.date }}"
    backup_dir: "{{ backup_root }}/{{ backup_date }}"

  tasks:
    - name: Buat folder backup per tanggal
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
      delegate_to: localhost

    - name: Ambil konfigurasi aktif (running config)
      junipernetworks.junos.junos_config:
        retrieve: running
        format: text
      register: running_config

    - name: Simpan konfigurasi ke file lokal (.txt)
      ansible.builtin.copy:
        content: "{{ running_config['config'] }}"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}-{{ backup_date }}.txt"
      delegate_to: localhost
