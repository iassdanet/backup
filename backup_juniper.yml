---
- name: Backup Junos configuration
  hosts: juniper_switches
  gather_facts: no
  connection: ansible.netcommon.netconf

  vars:
    backup_dir: "/var/lib/awx/projects/_14__backup_stdt/backup"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:
    - name: Pastikan folder backup ada (lokal, di pod AWX)
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Ambil konfigurasi aktif dari switch
      junipernetworks.junos.junos_command:
        commands: show configuration
      register: config_output

    - name: Normalisasi hostname
      set_fact:
        safe_hostname: "{{ inventory_hostname | replace(' ', '_') }}"

    - name: Simpan konfigurasi ke file unik (hostname + timestamp, di AWX pod)
      copy:
        content: "{{ config_output.stdout[0] | default('EMPTY OUTPUT') }}"
        dest: "{{ backup_dir }}/{{ safe_hostname }}_{{ timestamp }}.txt"
      delegate_to: localhost

    - name: Debug - konfirmasi path hasil backup
      debug:
        msg: "Config {{ safe_hostname }} disimpan di {{ backup_dir }}/{{ safe_hostname }}_{{ timestamp }}.txt"
