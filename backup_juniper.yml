---
- name: Backup konfigurasi semua Junos host
  hosts: juniper_switches
  gather_facts: no
  collections:
    - junipernetworks.junos
  # Penting: Pastikan koneksi ini didefinisikan juga di inventory host Anda
  connection: ansible.netcommon.netconf

  vars:
    backup_folder: "./backup_configs"

  pre_tasks:
    - name: Pastikan ncclient terinstal (diperlukan untuk koneksi NETCONF)
      ansible.builtin.pip:
        name: ncclient
        state: present
      delegate_to: localhost

  tasks:
    - name: Buat folder backup jika belum ada (di localhost)
      ansible.builtin.file:
        path: "{{ backup_folder }}"
        state: directory
        mode: '0755'
      delegate_to: localhost # Pastikan ini berjalan di mesin lokal Ansible

    - name: Ambil konfigurasi perangkat (via NETCONF)
      # Modul junos_config membutuhkan koneksi netconf
      junipernetworks.junos.junos_config:
        retrieve: config
        format: text # Atau 'set' jika Anda ingin format set
      register: config_backup

    - name: Simpan konfigurasi ke file lokal (di localhost)
      ansible.builtin.copy:
        content: "{{ config_backup.config }}"
        dest: "{{ backup_folder }}/{{ inventory_hostname }}_backup_{{ ansible_date_time.iso8601 }}.conf"
      delegate_to: localhost # Pastikan ini berjalan di mesin lokal Ansible

    - name: Tampilkan pesan sukses
      ansible.builtin.debug:
        msg: "Backup konfigurasi {{ inventory_hostname }} berhasil disimpan di {{ backup_folder }}"
