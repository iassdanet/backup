---
- name: Backup Junos configuration and push to GitHub
  hosts: all
  gather_facts: no
  connection: ansible.netcommon.netconf

  tasks:
    - name: Get committed config in text format
      junipernetworks.junos.junos_config:
        retrieve: committed
        format: text
      register: config_output

    - name: Save config to local file
      copy:
        content: "{{ config_output.config }}"
        dest: "backup/{{ inventory_hostname }}.txt"

    - name: Initialize Git repo (if not already)
      command: git init
      args:
        chdir: backup/
      ignore_errors: yes

    - name: Add all changes to Git
      command: git add .
      args:
        chdir: backup/

    - name: Commit changes
      command: git commit -m "Backup {{ inventory_hostname }} on {{ ansible_date_time.date }} {{ ansible_date_time.time }}"
      args:
        chdir: backup/
      ignore_errors: yes

    - name: Push to GitHub
      command: git push origin main
      args:
        chdir: backup/
