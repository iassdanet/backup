---
- name: Backup Junos configuration (display set, via local connection)
  hosts: juniper_switches
  gather_facts: no
  connection: local

  tasks:
    - name: Buat folder backup per tanggal
      ansible.builtin.file:
        path: "./backup/{{ inventory_hostname }}/{{ lookup('pipe','date +%Y-%m-%d') }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: Ambil konfigurasi full (display set)
      junipernetworks.junos.junos_command:
        commands:
          - "show configuration | display set"
      register: config_out

    - name: Simpan hasil backup ke file .txt
      ansible.builtin.copy:
        content: "{{ config_out.stdout[0] }}"
        dest: "./backup/{{ inventory_hostname }}/{{ lookup('pipe','date +%Y-%m-%d') }}/running_config.txt"
      delegate_to: localhost

    - name: Debug kalau sukses
      ansible.builtin.debug:
        msg: "Backup sukses disimpan di ./backup/{{ inventory_hostname }}/{{ lookup('pipe','date +%Y-%m-%d') }}/running_config.txt"
      delegate_to: localhost
