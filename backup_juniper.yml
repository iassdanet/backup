---
- name: Backup Junos configuration and push to GitHub
  hosts: juniper_switches
  gather_facts: no
  connection: netconf

  vars:
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    repo_url: "ssh://git@ssh.github.com:443/iassdanet/backupconfig.git"
    local_repo: "/tmp/backupconfig"
    backup_file: "{{ local_repo }}/{{ inventory_hostname }}_{{ timestamp }}.txt"

  tasks:
    - name: Get committed config (text format)
      junipernetworks.junos.junos_command:
        commands: "show configuration"
      register: config_output

    - name: Clone repo if not exists
      git:
        repo: "{{ repo_url }}"
        dest: "{{ local_repo }}"
        version: main
        accept_hostkey: yes
      delegate_to: localhost

    - name: Save config to local file
      copy:
        content: "{{ config_output.stdout[0] | default('EMPTY OUTPUT') }}"
        dest: "{{ backup_file }}"
      delegate_to: localhost

    - name: Commit and push backup file
      shell: |
        cd {{ local_repo }}
        git config user.name "awx-bot"
        git config user.email "awx-bot@example.com"
        git add .
        git commit -m "Backup {{ inventory_hostname }} at {{ timestamp }}" || echo "No changes to commit"
        git push origin main
      delegate_to: localhost
