---
- name: Junos Automation - Facts & Backup
  hosts: juniper_switches
  gather_facts: no
  collections:
    - junipernetworks.junos

  tasks:
    - name: Retrieve device facts
      junos_facts:
      register: device_facts

    - name: Show device facts (debug)
      debug:
        var: device_facts

    - name: Retrieve config in 'set' format
      junos_config:
        retrieve: committed
        format: set
      register: config_out

    - name: Ensure backup folder exists
      local_action: file
        path: "./backups"
        state: directory

    - name: Save backup config to file (hostname + date)
      copy:
        content: "{{ config_out.config }}"
        dest: "./backups/{{ inventory_hostname }}-{{ lookup('pipe', 'date +%Y%m%d') }}.conf"
