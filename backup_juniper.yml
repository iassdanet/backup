---
- name: Backup Junos configuration (retrieve committed)
  hosts: juniper_switches
  gather_facts: no
  connection: local

  tasks:
    - name: Buat folder backup per tanggal
      ansible.builtin.file:
        path: "backup/{{ inventory_hostname }}/{{ lookup('pipe','date +%Y-%m-%d') }}"
        state: directory
        mode: '0755'

    - name: Ambil konfigurasi committed
      junipernetworks.junos.junos_config:
        retrieve: committed
      register: config_output

    - name: Simpan konfigurasi ke file
      ansible.builtin.copy:
        content: "{{ config_output['__ansible_stdout__'] | default(config_output.stdout, true) }}"
        dest: "backup/{{ inventory_hostname }}/{{ lookup('pipe','date +%Y-%m-%d') }}/config_retrieve.txt"

    - name: Debug hasil konfigurasi
      ansible.builtin.debug:
        var: config_output
