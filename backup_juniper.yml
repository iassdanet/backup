---
- name: Backup konfigurasi Juniper
  hosts: juniper_switches
  gather_facts: no
  connection: ansible.netcommon.netconf

  tasks:
    - name: Buat folder backup dengan tanggal
      ansible.builtin.file:
        path: "./backups/{{ inventory_hostname }}/{{ lookup('pipe','date +%Y-%m-%d') }}"
        state: directory
      delegate_to: localhost

    - name: Ambil konfigurasi committed
      junipernetworks.junos.junos_config:
        backup: yes
        backup_options:
          filename: "junos_{{ inventory_hostname }}_{{ lookup('pipe','date +%Y-%m-%d_%H-%M') }}.conf"
          dir_path: "./backups/{{ inventory_hostname }}/{{ lookup('pipe','date +%Y-%m-%d') }}"
