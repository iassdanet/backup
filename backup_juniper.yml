---
- name: Backup konfigurasi Juniper
  hosts: juniper_switches
  connection: local
  gather_facts: no
  tasks:
    - name: Buat folder backup dengan tanggal
      ansible.builtin.file:
        path: "./backups/{{ inventory_hostname }}"
        state: directory
        mode: '0755'

    - name: Ambil konfigurasi committed
      junipernetworks.junos.junos_config:
        retrieve: committed
      register: backup_cfg

    - name: Simpan hasil backup ke file
      copy:
        content: "{{ backup_cfg['config'] }}"
        dest: "./backups/{{ inventory_hostname }}/{{ inventory_hostname }}-{{ lookup('pipe','date +%Y%m%d_%H%M%S') }}.conf"
