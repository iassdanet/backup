---
- name: backup config
  hosts: juniper_switches
  gather_facts: no
  collections:
    - ansible.netcommon

 tasks:
    - name: Menjalankan perintah show configuration
      junipernetworks.junos.junos_cli:
        command: "show configuration | display set"
      register: junos_config_cli

    - name: Menyimpan konfigurasi dalam format teks
      ansible.builtin.copy:
        content: "{{ junos_config_cli.stdout }}"
        dest: "backup/{{ inventory_hostname }}.txt"
      delegate_to: localhost
