---
- name: Backup Junos configuration and push to GitHub
  hosts: juniper_switches
  gather_facts: no
  connection: netconf

  vars:
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    backup_file: "/tmp/{{ inventory_hostname }}_{{ timestamp }}.txt"

  tasks:
    - name: Get config from device
      junipernetworks.junos.junos_command:
        commands: "show configuration | display set"
      register: config_output

    - name: Save configuration to file
      copy:
        content: "{{ config_output.stdout[0] | default('EMPTY OUTPUT') }}"
        dest: "{{ backup_file }}"
      delegate_to: localhost

    - name: Initialize git repo (if not exists)
      shell: |
        cd /tmp
        if [ ! -d ".git" ]; then
          git init
          git remote add origin https://{{ github_token }}@github.com/YOURORG/YOURREPO.git
        fi
      delegate_to: localhost

    - name: Commit and push backup file to GitHub
      shell: |
        cd /tmp
        git config user.name "awx-bot"
        git config user.email "awx-bot@example.com"
        cp {{ backup_file }} repo/
        cd repo
        git add .
        git commit -m "Backup {{ inventory_hostname }} at {{ timestamp }}"
        git push origin main
      delegate_to: localhost
