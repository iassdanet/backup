---
- name: Backup Junos Configuration
  hosts: juniper_switches
  connection: netconf
  gather_facts: no

  tasks:
    - name: Backup current committed config
      junipernetworks.junos.junos_config:
        backup: true
        backup_options:
          filename: "{{ inventory_hostname }}_backup.txt"
          dir_path: "/home/iass/junos_backup"
