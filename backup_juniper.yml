---
- name: Backup Junos configurations
  hosts: juniper_switches # Replace with your inventory group for Junos devices
  connection: local
  gather_facts: false

  tasks:
    - name: Retrieve and save configuration
      junipernetworks.junos.junos_config:
        retrieve: config
        dest: "./backups/{{ inventory_hostname }}_config.conf" # Path to save the backup
      register: junos_backup_result

    - name: Display backup status
      debug:
        msg: "Backup for {{ inventory_hostname }} completed
