---
- name: Backup Junos configuration (display set)
  hosts: juniper_switches
  connection: ansible.netcommon.netconf
  gather_facts: no

  vars:
    backup_root: "./backup"
    backup_date: "{{ lookup('pipe','date +%Y%m%d') }}"

  tasks:
    - name: Buat folder backup per tanggal
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ backup_root }}/{{ inventory_hostname }}/{{ backup_date }}"
        state: directory
        mode: '0755'

    - name: Ambil konfigurasi full (display set)
      junipernetworks.junos.junos_rpc:
        rpc: get-configuration
        output: text
        args:
          format: set
      register: config_out

    - name: Simpan hasil ke file .txt
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ config_out.stdout }}"
        dest: "{{ backup_root }}/{{ inventory_hostname }}/{{ backup_date }}/running-config.txt"

    - name: Debug kalau sukses
      ansible.builtin.debug:
        msg: "Backup sukses disimpan di {{ backup_root }}/{{ inventory_hostname }}/{{ backup_date }}/running-config.txt"
