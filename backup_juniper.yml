---
- name: Backup Konfigurasi Switch Juniper
  hosts: juniper_switches
  gather_facts: false

  tasks: ## tugasnya ngapain aja
    - name: show configuration ##ini buat command nya
      junipernetworks.junos.junos_cli:
        command: "show configuration | display set"
      register: junos_config_cli

    - name: save.txt ##ini buat ngesave nya di bentuk txt
      ansible.builtin.copy:
        content: "{{ junos_config_cli.stdout }}"
        dest: "backup/{{ inventory_hostname }}.txt"
      delegate_to: localhost
