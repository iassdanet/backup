---
- name: Backup konfigurasi Juniper
  hosts: juniper_switches
  gather_facts: no
  connection: local

  tasks:
    - name: Buat folder backup dengan tanggal
      file:
        path: "backup/{{ ansible_date_time.date }}"
        state: directory
        mode: '0755'

    - name: Ambil konfigurasi committed
      junipernetworks.junos.junos_facts:
        gather_subset:
          - config
        config_format: text
      register: hasil_config

    - name: Simpan konfigurasi ke file
      copy:
        content: "{{ hasil_config.ansible_facts.config }}"
        dest: "backup/{{ ansible_date_time.date }}/{{ inventory_hostname }}.conf"
