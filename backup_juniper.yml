---
- name: Backup Junos configuration
  hosts: juniper_switches
  gather_facts: no
  connection: ansible.netcommon.netconf

  vars:
    # --- Variabel Utama ---
    # Ubah jalur backup ke lokasi yang umum bisa ditulis semua user
    backup_dir: "/tmp/junos-backups"

    # Timestamp untuk nama file backup, dibuat saat playbook dijalankan.
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    # Nama file backup lengkap, menggunakan hostname dan timestamp.
    backup_file_path: "{{ backup_dir }}/{{ inventory_hostname | replace(' ', '_') }}_{{ timestamp }}.txt"

  tasks:
    - name: Ensure backup directory exists on the local server
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'
      delegate_to: awx-host
      run_once: true

    - name: Retrieve active configuration from the device
      junipernetworks.junos.junos_command:
        commands: show configuration
      register: config_output

    - name: Save configuration to a file on the local server
      ansible.builtin.copy:
        content: "{{ config_output.stdout[0] | default('EMPTY OUTPUT') }}"
        dest: "{{ backup_file_path }}"
      delegate_to: awx-host
