---
- name: Backup Konfigurasi Switch Juniper
  hosts: juniper_switches
  gather_facts: false
  
  tasks:
    - name: Mengambil konfigurasi aktif
      junipernetworks.junos.junos_rpc:
        rpc: "get-config"
        format: xml
      register: junos_config_xml

    - name: Menyimpan konfigurasi dalam format XML
      ansible.builtin.copy:
        content: "{{ junos_config_xml.xml_config }}"
        dest: "backup/{{ inventory_hostname }}.xml"
      delegate_to: localhost
