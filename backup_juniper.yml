---
- name: Backup Junos configuration
  hosts: juniper_switches
  gather_facts: no
  connection: ansible.netcommon.netconf

  vars:
    # Folder backup writable di Execution Environment
    host_final_dir: "/runner/backup"

    # Timestamp untuk file backup
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    # File backup full path
    backup_file: "{{ host_final_dir }}/{{ inventory_hostname | replace(' ', '_') }}_{{ timestamp }}.txt"

    # Namespace dan label pod AWX task
    awx_namespace: "awx"
    awx_task_label: "app.kubernetes.io/name=awx-demo-task"

  tasks:
    - name: Pastikan folder backup ada di EE
      ansible.builtin.file:
        path: "{{ host_final_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Ambil konfigurasi aktif dari switch
      junipernetworks.junos.junos_command:
        commands: show configuration
      register: config_output

    - name: Simpan konfigurasi langsung ke host/EE
      ansible.builtin.copy:
        content: "{{ config_output.stdout[0] | default('EMPTY OUTPUT') }}"
        dest: "{{ backup_file }}"
      delegate_to: localhost

    - name: Ambil nama pod AWX task yang Running
      ansible.builtin.shell: |
        kubectl get pods -n {{ awx_namespace }} -l {{ awx_task_label }} \
          -o jsonpath='{.items[0].metadata.name}'
      register: awx_pod
      delegate_to: localhost

    - name: Salin file backup ke pod AWX (opsional)
      ansible.builtin.shell: |
        kubectl cp "{{ backup_file }}" "{{ awx_pod.stdout }}:{{ backup_file }}"
      when: awx_pod.stdout != ""
      delegate_to: localhost
