---
- name: Backup Junos configuration (display set)
  hosts: juniper_switches
  gather_facts: no
  connection: local

  vars:
    backup_root: "./backup"
    backup_date: "{{ lookup('pipe', 'date +%Y-%m-%d') }}"

  tasks:
    - name: Buat folder backup per tanggal
      file:
        path: "{{ backup_root }}/{{ backup_date }}"
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: Ambil konfigurasi full (display set)
      junipernetworks.junos.junos_command:
        commands:
          - "show configuration | display set | no-more"
      register: config

    - name: Simpan hasil konfigurasi ke file
      copy:
        content: "{{ config.stdout[0] }}"
        dest: "{{ backup_root }}/{{ backup_date }}/{{ inventory_hostname }}.set"
      delegate_to: localhost

    - name: Debug path file backup
      debug:
        msg: "Backup tersimpan di {{ backup_root }}/{{ backup_date }}/{{ inventory_hostname }}.set"
