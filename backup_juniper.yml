---
- name: Backup Junos configuration
  hosts: juniper_switches
  gather_facts: no
  connection: ansible.netcommon.netconf

  vars:
    pod_temp_dir: "/tmp/backup"
    host_final_dir: "/home/iass/awx-deploy/backup"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    file_path_pod: "{{ pod_temp_dir }}/{{ inventory_hostname | replace(' ', '_') }}_{{ timestamp }}.txt"
    file_path_host: "{{ host_final_dir }}/{{ inventory_hostname | replace(' ', '_') }}_{{ timestamp }}.txt"

  tasks:
    - name: Pastikan folder sementara di pod ada
      ansible.builtin.file:
        path: "{{ pod_temp_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Ambil konfigurasi aktif dari switch
      junipernetworks.junos.junos_command:
        commands: show configuration
      register: config_output

    - name: S
