- name: Backup Junos Configuration
  hosts: juniper_switches
  gather_facts: no
  connection: netconf

  tasks:
    - name: Get committed configuration
      junipernetworks.junos.junos_config:
        retrieve: committed
      register: committed

    - name: Buat folder backup di controller
      delegate_to: localhost
      file:
        path: "/home/iass/junos_backup"
        state: directory
        mode: '0755'

    - name: Simpan config ke file .txt
      delegate_to: localhost
      copy:
        content: "{{ committed.ansible_facts.ansible_net_config }}"
        dest: "/home/iass/junos_backup/{{ inventory_hostname }}_{{ lookup('pipe','date +%Y%m%d_%H%M%S') }}.txt"
