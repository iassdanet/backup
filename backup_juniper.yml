---
- name: Backup Junos configuration
  hosts: juniper_switches
  gather_facts: no
  connection: ansible.netcommon.netconf

  vars:
    backup_dir: "/home/iass/awx-deploy/junos-backups"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    backup_file_path: "{{ backup_dir }}/{{ inventory_hostname | replace(' ', '_') }}_{{ timestamp }}.txt"

  tasks:
    - name: Get config from device
      ansible.builtin.shell: |
        ssh {{ ansible_user }}@{{ ansible_host }} 'show configuration'
      register: config_output

    - name: Save configuration to a file on the local server
      ansible.builtin.copy:
        content: "{{ config_output.stdout | default('EMPTY OUTPUT') }}"
        dest: "{{ backup_file_path }}"
      delegate_to: awx-host
