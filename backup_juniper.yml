---
- name: Backup konfigurasi Juniper via NETCONF
  hosts: juniper_switches
  connection: ansible.netcommon.netconf
  gather_facts: no

  vars:
    backup_root: "./backup"
    backup_date: "{{ ansible_date_time.date }}"
    backup_dir: "{{ backup_root }}/{{ backup_date }}"

  tasks:
    - name: Buat folder backup per tanggal
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
      delegate_to: localhost

    - name: Ambil konfigurasi aktif (candidate config)
      junipernetworks.junos.junos_config:
        retrieve: candidate
        format: text
      register: running_config

    - name: Simpan konfigurasi ke file lokal
      ansible.builtin.copy:
        content: "{{ running_config['config'] }}"
        dest: "{{ backup_dir }}/{{ inventory_hostname }}.conf"
      delegate_to: localhost

    - name: Kompres hasil backup jadi tar.gz
      ansible.builtin.archive:
        path: "{{ backup_dir }}"
        dest: "{{ backup_root }}/juniper-backup-{{ backup_date }}.tar.gz"
        format: gz
      delegate_to: localhost
