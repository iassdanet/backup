---
- name: Backup Junos configuration
  hosts: juniper_switches
  gather_facts: no
  connection: ansible.netcommon.netconf

  vars:
    backup_dir: "../junos_backups"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    file_path: "{{ backup_dir }}/{{ inventory_hostname | replace(' ', '_') }}_{{ timestamp }}.txt"

  tasks:
    - name: Pastikan folder backup ada
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Ambil konfigurasi aktif dari switch
      junipernetworks.junos.junos_command:
        commands: show configuration
      register: config_output

    - name: Simpan konfigurasi ke file permanen
      ansible.builtin.file:
        path: "{{ file_path }}"
        content: "{{ config_output.stdout[0] | default('EMPTY OUTPUT') }}"
        mode: '0644'
      delegate_to: localhost

    - name: Verifikasi file dibuat
      ansible.builtin.stat:
        path: "{{ file_path }}"
      register: file_check
      delegate_to: localhost

    - name: Debug - Tampilkan hasil verifikasi
      ansible.builtin.debug:
        msg: "File {{ file_path }} ada: {{ file_check.stat.exists }}"
      delegate_to: localhost
