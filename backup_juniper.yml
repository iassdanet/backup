---
- name: Backup Junos configuration
  hosts: juniper_switches
  gather_facts: no
  connection: ansible.netcommon.netconf

  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    backup_file: "/tmp/{{ inventory_hostname }}_{{ timestamp }}.conf"

  tasks:
    - name: Get running configuration from Junos
      junipernetworks.junos.junos_command:
        commands: "show configuration | display set"
      register: config_output

    - name: Save configuration to file inside AWX
      copy:
        content: "{{ config_output.stdout[0] | default('EMPTY OUTPUT') }}"
        dest: "{{ backup_file }}"
      delegate_to: localhost
