- name: Backup konfigurasi Juniper
  hosts: juniper_switches
  connection: ansible.netcommon.netconf
  gather_facts: no

  tasks:
    - name: Ambil konfigurasi via RPC
      junipernetworks.junos.junos_rpc:
        rpc: get-config
        output: text
      register: config

    - name: Simpan hasil konfigurasi
      copy:
        content: "{{ config.stdout[0] }}"
        dest: "backup/{{ inventory_hostname }}.txt"
      delegate_to: localhost
