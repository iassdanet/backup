- name: Backup konfigurasi Juniper
  hosts: juniper_switches
  connection: ansible.netcommon.netconf
  gather_facts: no

  tasks:
    - name: Backup konfigurasi aktif
      junipernetworks.junos.junos_config:
        backup: yes
      register: backup_out

    - name: Buat folder backup di localhost
      ansible.builtin.file:
        path: backup
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: Simpan hasil backup dengan timestamp
      ansible.builtin.copy:
        content: "{{ backup_out.backup_path | default('') | ansible.builtin.slurp }}"
        dest: "backup/{{ inventory_hostname }}-{{ lookup('pipe','date +%Y%m%d_%H%M%S') }}.conf"
      delegate_to: localhost
