---
- name: Backup Junos configuration
  hosts: juniper_switches
  gather_facts: no
  connection: ansible.netcommon.netconf

  tasks:
    - name: Ensure backup directory exists (local)
      file:
        path: /home/iass/awx-deploy/backup
        state: directory
      delegate_to: localhost

    - name: Get committed config (show configuration)
      junipernetworks.junos.junos_command:
        commands: show configuration
      register: config_output

    - name: Debug full config_output
      debug:
        var: config_output

    - name: Save config to file on Ansible host
      ansible.builtin.copy:
        content: "{{ config_output.stdout[0] | default('NO OUTPUT') }}"
        dest: "/home/iass/awx-deploy/backup/{{ inventory_hostname }}.txt"
      delegate_to: localhost
      run_once: false
      register: save_result

    - name: Debug confirm file saved
      debug:
        var: save_result
