---
- name: Test Junos connectivity via CLI
  hosts: junos
  gather_facts: no
  collections:
    - ansible.netcommon

  tasks:
    - name: Jalankan "show version"
      ansible.netcommon.cli_command:
        command: "show version"
      register: show_version

    - name: Tampilkan hasil "show version"
      debug:
        msg: "{{ show_version.stdout }}"
